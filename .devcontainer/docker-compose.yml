version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount the workspace
      - ..:/workspace:cached
      # Docker-in-Docker (DooD) - mount host Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    network_mode: bridge
